name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smart-education-backend:ci
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: smart-education-frontend:ci
          load: true

  compose-validate:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config -q

  compose-integration-test:
    name: Docker Compose integration tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, compose-validate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Verify service status
        run: docker compose ps

      - name: Verify health endpoints
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/health
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/health

      - name: Seed sample courses
        run: docker compose exec -T backend npm run seed

      - name: Verify course API endpoints
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/api/courses | grep -q "Full-Stack Web Development"
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/courses | grep -q "Full-Stack Web Development"

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v
